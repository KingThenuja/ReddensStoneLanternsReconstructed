plugins {
    id 'multiloader-loader'
    id 'net.minecraftforge.gradle' version '6.0.54'
    id 'org.spongepowered.mixin' version '0.7-SNAPSHOT'
    id "com.modrinth.minotaur"
    id "net.darkhax.curseforgegradle"
}
def modrinthToken = System.getenv("MODRINTH_TOKEN")
def secretPropsFile = rootProject.file('publishing.properties')
def secretProps = new Properties()

if (secretPropsFile.exists()) {
    secretPropsFile.withInputStream { stream ->
        secretProps.load(stream)
    }
} else {
    logger.warn("publishing.properties file not found!")
}

def cfToken = secretProps.getProperty('curseforge_token') ?: ""

modrinth {
    token = modrinthToken
    projectId = property("modrinth_project_id").toString()
    versionNumber = version.toString()
    versionType = property("versionType").toString()
    uploadFile = tasks.findByName("remapJar") ?: tasks.named("jar")
    gameVersions = ["1.21", property("minecraft_version").toString()]
    loaders = ["forge"]
    changelog = rootProject.file("CHANGELOG.md").text
}
tasks.register('publishCurseForge', net.darkhax.curseforgegradle.TaskPublishCurseForge) {
    apiToken = cfToken
    def projectId = ("${curseforge_project_id}").toLong()
    def mainFile = upload(projectId, tasks.findByName("remapJar") ?: tasks.named("jar"))
    mainFile.displayName = "Redden's Stone Lanterns Reconstructed v${version}"
    mainFile.releaseType = "${versionType}"
    mainFile.changelogType = "markdown"
    mainFile.changelog = rootProject.file("CHANGELOG.md").text
    mainFile.addGameVersion("1.21")
    mainFile.addGameVersion("${minecraft_version}")
    mainFile.addModLoader("Forge")
}

tasks.named('publishCurseForge').configure {
    dependsOn tasks.findByName("remapJar") ?: tasks.named("jar")
}

base {
    archivesName = "${mod_name}-${version}-FORGE-${minecraft_version}"
}
jar {

}
sourceSets {
    main {
        resources {
            srcDirs += project(':common').file('src/main/generated')
        }
    }
}
minecraft {
    mappings channel: 'official', version: minecraft_version

    copyIdeResources = true //Calls processResources when in dev

    reobf = false // Forge 1.20.6+ uses official mappings at runtime, so we shouldn't reobf from official to SRG

    // Automatically enable forge AccessTransformers if the file exists
    // This location is hardcoded in Forge and can not be changed.
    // https://github.com/MinecraftForge/MinecraftForge/blob/be1698bb1554f9c8fa2f58e32b9ab70bc4385e60/fmlloader/src/main/java/net/minecraftforge/fml/loading/moddiscovery/ModFile.java#L123
    // Forge still uses SRG names during compile time, so we cannot use the common AT's
    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformer = at
    }

    runs {
        client {
            workingDirectory file('runs/client')
            ideaModule "${rootProject.name}.${project.name}.main"
            taskName 'Client'
            mods {
                modClientRun {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory file('runs/server')
            ideaModule "${rootProject.name}.${project.name}.main"
            taskName 'Server'
            mods {
                modServerRun {
                    source sourceSets.main
                }
            }
        }

        data {
            workingDirectory file('runs/data')
            ideaModule "${rootProject.name}.${project.name}.main"
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
            taskName 'Data'
            mods {
                modDataRun {
                    source sourceSets.main
                }
            }
        }
    }
}

sourceSets.main.resources.srcDir 'src/generated/resources'

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor("org.spongepowered:mixin:0.8.5-SNAPSHOT:processor")

    // Forge's hack fix
    implementation('net.sf.jopt-simple:jopt-simple:5.0.4') { version { strictly '5.0.4' } }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            fg.component(it)
        }
    }
}

sourceSets.each {
    def dir = layout.buildDirectory.dir("sourcesSets/$it.name")
    it.output.resourcesDir = dir
    it.java.destinationDirectory = dir
}
java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}